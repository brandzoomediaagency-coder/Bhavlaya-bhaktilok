<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>आप ऑफलाइन हैं | भावलय (Bhavlaya)</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #FAF8F2;
      color: #22201E;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
    }
    .card {
      background: #FFFDF8;
      border: 1px solid rgba(181, 138, 67, 0.3);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    .icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(217, 119, 6, 0.1);
      color: #D97706;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 28px;
    }
    h1 {
      color: #651D32;
      margin: 0 0 0.5rem;
      font-size: 1.5rem;
    }
    p {
      color: #81786B;
      font-size: 0.875rem;
      line-height: 1.6;
      margin: 0 0 1.5rem;
    }
    .btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: #D97706;
      color: #FFF;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      border: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🕉️</div>
    <h1>आप अभी ऑफलाइन हैं</h1>
    <p>इंटरनेट कनेक्शन अनुपलब्ध है। कृपया अपना नेटवर्क कनेक्शन जांचें और पुनः प्रयास करें।</p>
    <button class="btn" onclick="window.location.reload()">पुनः प्रयास करें</button>
  </div>
</body>
</html>
